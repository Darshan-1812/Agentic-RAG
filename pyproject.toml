[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "calibrag"
version = "0.2.0"
description = "CalibRAG: Adaptive Dual-System RAG & Agent Platform (System 1 Jev + System 2 Cascaded RAG)"
authors = [
    { name = "Member 1: System 1 Router & Verifier Lead" },
    { name = "Member 2: Data, Hybrid RAG & GraphRAG Lead" },
    { name = "Member 3: Agentic Workflow & FastMCP Lead" },
    { name = "Member 4: BYOK Studio UI & Benchmark Lead" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "httpx>=0.24.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.20.0"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
