[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "acr-rag"
version = "0.1.0"
description = "ACR-RAG: Adaptive Control & Retrieval Platform (System 1 Jev + System 2 Agentic RAG)"
authors = [
    { name = "Member 1: Control Plane & Router Lead" },
    { name = "Member 2: Data, Hybrid RAG & GraphRAG Lead" },
    { name = "Member 3: Agentic Workflow & FastMCP Lead" },
    { name = "Member 4: Product UI, Control Room & Eval Lead" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "httpx>=0.24.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.20.0"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
